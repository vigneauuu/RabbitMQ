services:
  sender:
    build: ./sender
    container_name: sender
    depends_on:
      - rabbit
    networks:
      rabbitmq-net:
        ipv4_address: 192.168.20.2
    extra_hosts:
      - "rabbitHack:192.168.20.1"
    cap_add:
      - NET_ADMIN
    tty: true
    stdin_open: true
    environment:
      - BROKER_HOST=rabbitHack
      - BROKER_PORT=5672
      - BROKER_USER=${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      - BROKER_PASS=${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      - QUEUE=Cola_Mensajes


  receiver:
    build: ./receiver
    container_name: receiver
    depends_on:
      - rabbit
    networks:
      rabbitmq-net:
        ipv4_address: 192.168.20.3
    restart: unless-stopped
    environment:
      - BROKER_HOST=rabbit
      - BROKER_PORT=5672
      - BROKER_USER=${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      - BROKER_PASS=${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
      - QUEUE=Cola_Mensajes

  rabbit:
    image: rabbitmq:4-management
    container_name: rabbit
    hostname: rabbit
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    networks:
      rabbitmq-net:
        ipv4_address: 192.168.20.4
    restart: unless-stopped

  sniffer:
    build:
      context: ./sniffer
    container_name: sniffer
    network_mode: host
    tty: true
    volumes:
      - ./captura:/captura

  interceptor:
    build: ./interceptor
    container_name: interceptor
    network_mode: host     # acceso directo a 0.0.0.0:5672
    privileged: true       # para iptables/NFQUEUE
    tty: true
    restart: unless-stopped


networks:
  rabbitmq-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
