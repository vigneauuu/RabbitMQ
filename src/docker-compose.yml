services:
  sender:
    environment:
      BROKER_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      BROKER_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    build: ./sender
    container_name: sender
    depends_on:
      - rabbit
    networks:
      - rabbitmq-net
    tty: true            # <-- indispensable p/ consola viva
    stdin_open: true     # <-- habilita tu teclado

  receiver:
    environment:
      BROKER_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      BROKER_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    build: ./receiver
    container_name: receiver
    depends_on:
      - rabbit
    networks:
      - rabbitmq-net
    restart: unless-stopped

  rabbit:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    networks:
      - rabbitmq-net
    restart: unless-stopped

networks:
  rabbitmq-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
